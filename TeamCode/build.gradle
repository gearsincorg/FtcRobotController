apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

// Regenerate AutoPaths.java from the .turt files in /turt_files before every build.
// Skipped (with a warning) if Python can't be found; fails the build if a .turt file is invalid.
def findPython() {
    for (String candidate : ['python', 'python3', 'py']) {
        try {
            def probe = [candidate, '--version'].execute()
            probe.consumeProcessOutput()
            if (probe.waitFor() == 0) return candidate
        } catch (IOException ignored) { }
    }
    return null
}

tasks.register('generatePaths', Exec) {
    group = 'build'
    description = 'Converts turt_files/*.turt files into methods in AutoPaths.java (tools/turt2java.py)'

    def script = rootProject.file('tools/turt2java.py')
    def python = findPython()

    inputs.files(fileTree(rootProject.file('turt_files')) { include '*.turt' }, script)
    outputs.file('src/main/java/org/firstinspires/ftc/teamcode/AutoPaths.java')

    onlyIf {
        if (python == null) logger.warn('WARNING: Python not found - skipping turt2java; AutoPaths.java may be out of date.')
        python != null
    }
    if (python != null) commandLine python, script.absolutePath
}

// Disabled: AutoPaths.java was removed in the auto rewrite. Run 'generatePaths' manually if needed.
// tasks.named('preBuild') { dependsOn 'generatePaths' }

// Connect ADB to the Control Hub over Wi-Fi so Run/Deploy works without a manual 'adb connect'.
// Runs before every build (Android Studio's Run button doesn't use Gradle's install tasks), but is
// harmless: it never fails the build, and skips instantly if the hub isn't reachable or already connected.
tasks.register('adbConnect') {
    group = 'build'
    description = 'Runs adb connect to the Control Hub (192.168.43.1:5555) if it is reachable'

    def hubHost = '192.168.43.1'
    def hubPort = 5555
    def sdkDir = null
    def props = rootProject.file('local.properties')
    if (props.exists()) {
        def p = new Properties()
        props.withInputStream { p.load(it) }
        sdkDir = p.getProperty('sdk.dir')
    }
    sdkDir = sdkDir ?: System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
    def adb = sdkDir ? new File(sdkDir, 'platform-tools/' + (isWindows ? 'adb.exe' : 'adb')) : null

    outputs.upToDateWhen { false }
    doLast {
        try {
            if (adb == null || !adb.exists()) {
                logger.warn('adbConnect: adb not found - skipping.')
                return
            }
            boolean reachable = false
            try {
                def socket = new Socket()
                socket.connect(new InetSocketAddress(hubHost, hubPort), 1500)
                socket.close()
                reachable = true
            } catch (IOException ignored) { }
            if (!reachable) {
                logger.lifecycle("adbConnect: ${hubHost}:${hubPort} not reachable - skipping (not on Control Hub Wi-Fi?).")
                return
            }
            def proc = [adb.absolutePath, 'connect', "${hubHost}:${hubPort}"].execute()
            def out = new StringBuilder()
            proc.consumeProcessOutput(out, out)
            proc.waitForOrKill(10000)
            logger.lifecycle('adbConnect: ' + out.toString().trim())
        } catch (Exception e) {
            logger.warn('adbConnect: skipped (' + e.message + ')')
        }
    }
}

tasks.named('preBuild') { dependsOn 'adbConnect' }

dependencies {
    implementation project(':FtcRobotController')
}

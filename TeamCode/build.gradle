apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

// Regenerate AutoPaths.java from the .pp files in /pp before every build.
// Skipped (with a warning) if Python can't be found; fails the build if a .pp file is invalid.
def findPython() {
    for (String candidate : ['python', 'python3', 'py']) {
        try {
            def probe = [candidate, '--version'].execute()
            probe.consumeProcessOutput()
            if (probe.waitFor() == 0) return candidate
        } catch (IOException ignored) { }
    }
    return null
}

tasks.register('generatePaths', Exec) {
    group = 'build'
    description = 'Converts pp/*.pp files into methods in AutoPaths.java (tools/pp2java.py)'

    def script = rootProject.file('tools/pp2java.py')
    def python = findPython()

    inputs.files(fileTree(rootProject.file('pp')) { include '*.pp' }, script)
    outputs.file('src/main/java/org/firstinspires/ftc/teamcode/AutoPaths.java')

    onlyIf {
        if (python == null) logger.warn('WARNING: Python not found - skipping pp2java; AutoPaths.java may be out of date.')
        python != null
    }
    if (python != null) commandLine python, script.absolutePath
}

tasks.named('preBuild') { dependsOn 'generatePaths' }

dependencies {
    implementation project(':FtcRobotController')
}
